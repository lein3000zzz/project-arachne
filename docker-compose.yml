services:
  crawler:
    build:
      context: .
      dockerfile: deployments/Dockerfile
    env_file:
      - main.env
    #    ports:
    #      - "36767:36767"
    volumes:
      - ./output/screenshots:/app/output/screenshots
      - ./deployments/opt/rod/cache:/root/.cache/rod
      # mounted so config edits need a restart, not a rebuild
      - ./configs:/root/configs:ro
    restart: always
    # Above shutdown.timeout in configs/config.yml. Docker's default of 10s would
    # kill the crawler while it is still flushing queued tasks and indexing.
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_started
      milvus:
        condition: service_healthy
      # Only the embedder picked by EMBEDDER (the compose profile) runs, and neither
      # does when the endpoint is external.
      ollama:
        condition: service_healthy
        required: false
      vllm:
        condition: service_healthy
        required: false

  search:
    build:
      context: .
      dockerfile: deployments/search.Dockerfile
    env_file:
      - main.env
    volumes:
      - ./configs:/root/configs:ro
    ports:
      - "8090:8090"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      ollama:
        condition: service_healthy
        required: false
      vllm:
        condition: service_healthy
        required: false

  # One-shot: `make rank`. Built from the search image, which carries both binaries.
  rank:
    build:
      context: .
      dockerfile: deployments/search.Dockerfile
    command: ["./rank"]
    profiles: [tools]
    env_file:
      - main.env
    volumes:
      - ./configs:/root/configs:ro
    depends_on:
      postgres:
        condition: service_healthy

  vault:
    image: hashicorp/vault
    environment:
      # VAULT_DEV_ROOT_TOKEN_ID: 123
#       VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    volumes:
      - ./deployments/opt/vault/data:/vault/data
      - ./deployments/vault/config:/vault/config
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    command: "server" # -config=/vault/config/vault.hcl # Конфиг подтягивается автоматически из файлов
    restart: always

  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: arachne
      # Read on the first start only, when the data directory is created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arachne-postgres}
      POSTGRES_DB: arachne
    volumes:
      # Postgres 18 images keep the data under a versioned subdirectory of this.
      - ./deployments/opt/postgres:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arachne -d arachne"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: 'redis'
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - '6379:6379'
    env_file:
      - main.env
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  broker:
    image: apache/kafka:latest
    container_name: broker
    env_file:
      - deployments/kafka/kafka.env
    volumes:
      - ./deployments/kafka/kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf
    ports:
      - "29092:29092"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    env_file:
      - deployments/kafka/kafkaui.env
    ports:
      - "8080:8080"
    depends_on:
      - broker
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - LOG_LEVEL=debug

  # Single container: embedded etcd and local-disk storage, as in Milvus's own
  # standalone_embed.sh. MinIO community images are no longer publicly pullable.
  milvus:
    image: milvusdb/milvus:v2.6.24
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - ./deployments/opt/milvus:/var/lib/milvus
      - ./deployments/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./deployments/milvus/user.yaml:/milvus/configs/user.yaml:ro
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 90s
      timeout: 20s
      retries: 5

  ollama:
    image: ollama/ollama:0.34.4
    profiles: [ollama]
    # Pinned to a few cores to leave the machine usable; `make models` sets the
    # model's thread count to match (OLLAMA_CPUS). Ollama counts every host core
    # on its own, and oversubscribed cores make a batch take minutes.
    cpuset: ${OLLAMA_CPUSET:-0-3}
    # the embedding model and the chat model with its 8k context, both loaded
    mem_limit: ${OLLAMA_MEMORY:-8g}
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: 2
    volumes:
      - ./deployments/opt/ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10

  vllm:
    # vllm-openai-cpu v0.30.0, amd64 and arm64. Its CPU kernels are tuned for x86
    # with AVX-512; on Apple Silicon it runs at about a third of Ollama's speed.
    image: vllm/vllm-openai-cpu@sha256:85d126740e78e9b7270b6cfc01159776d066c445609b7167faf32efc4a86f19d
    profiles: [vllm]
    # The model is fixed at start, unlike Ollama's pull-on-demand; the Makefile
    # passes the one named in the config. Weights download on the first start.
    command: ["${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}", "--runner", "pooling", "--max-model-len", "8192"]
    environment:
      # GiB for the KV cache. vLLM's default of 4 does not fit next to the rest of
      # the stack in Docker Desktop's default VM.
      VLLM_CPU_KVCACHE_SPACE: ${VLLM_CPU_KVCACHE_SPACE:-1}
      # Cores kept free of vLLM's OpenMP threads. By default it pins all but one, and
      # under embedding load Milvus's embedded etcd then misses its session lease
      # and Milvus exits.
      VLLM_CPU_NUM_OF_RESERVED_CPU: ${VLLM_CPU_NUM_OF_RESERVED_CPU:-4}
    shm_size: 1g
    volumes:
      - ./deployments/opt/huggingface:/root/.cache/huggingface
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Warm-up compiles the model: minutes on first start.
      start_period: 15m
