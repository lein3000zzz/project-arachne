services:
  crawler:
    build:
      context: .
      dockerfile: deployments/Dockerfile
    env_file:
      - main.env
    #    ports:
    #      - "36767:36767"
    volumes:
      - ./output/screenshots:/app/output/screenshots
      - ./deployments/opt/rod/cache:/root/.cache/rod
      # mounted so config edits need a restart, not a rebuild
      - ./configs:/root/configs:ro
    restart: always
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_started
      milvus:
        condition: service_healthy
      ollama:
        condition: service_healthy

  vault:
    image: hashicorp/vault
    environment:
      # VAULT_DEV_ROOT_TOKEN_ID: 123
#       VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    volumes:
      - ./deployments/opt/vault/data:/vault/data
      - ./deployments/vault/config:/vault/config
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    command: "server" # -config=/vault/config/vault.hcl # Конфиг подтягивается автоматически из файлов
    restart: always

  neo4j:
    image: neo4j:5-enterprise
    env_file:
      - deployments/neo4j/neo4j.env
    ports:
      - '7687:7687'
      - '7474:7474'
    volumes:
      - ./deployments/opt/neo4j_data:/data
      - ./deployments/opt/neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: 'redis'
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - '6379:6379'
    env_file:
      - main.env
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  broker:
    image: apache/kafka:latest
    container_name: broker
    env_file:
      - deployments/kafka/kafka.env
    volumes:
      - ./deployments/kafka/kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf
    ports:
      - "29092:29092"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    env_file:
      - deployments/kafka/kafkaui.env
    ports:
      - "8080:8080"
    depends_on:
      - broker
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - LOG_LEVEL=debug

  # Single container: embedded etcd and local-disk storage, as in Milvus's own
  # standalone_embed.sh. MinIO community images are no longer publicly pullable.
  milvus:
    image: milvusdb/milvus:v2.6.24
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - ./deployments/opt/milvus:/var/lib/milvus
      - ./deployments/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./deployments/milvus/user.yaml:/milvus/configs/user.yaml:ro
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 90s
      timeout: 20s
      retries: 5

  ollama:
    image: ollama/ollama:0.34.4
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: 4
    volumes:
      - ./deployments/opt/ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
