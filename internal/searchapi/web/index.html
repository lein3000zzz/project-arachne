<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arachne</title>
<meta name="description" content="Hybrid search, cited answers">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
// Blocking, before first paint: applied any later, the wrong theme flashes.
(function () {
  var stored = null;
  try { stored = localStorage.getItem("theme"); } catch (_) {}
  if (stored === "light" || stored === "dark") document.documentElement.setAttribute("data-theme", stored);
})();
</script>
<link rel="stylesheet" href="/static/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="shell">

<header class="site">
  <a class="brand" href="/">arachne</a>
  <nav class="nav" aria-label="Primary">
    <a href="#search">Search</a>
    <a href="#crawl">Crawl</a>
    <a href="https://lein3000.dev">lein3000.dev</a>
  </nav>
  <span class="who" id="who"></span>
  <button type="button" class="theme" id="logout">log out</button>
  <button type="button" class="theme" id="theme" aria-live="polite">theme: system</button>
</header>

<main id="main">
  <section class="hero" id="search">
    <p class="eyebrow">@arachne</p>
    <h1>Ask the crawled web.</h1>
    <p class="lede">Hybrid search, cited answers.</p>

    <form id="form" class="query" role="search">
      <div class="field">
        <label for="q">Query</label>
        <input id="q" type="search" placeholder="how do goroutines communicate?" autocomplete="off" autofocus required>
      </div>
      <button class="action primary" id="go">Search</button>
    </form>

    <div class="controls">
      <div class="control">
        <span class="control-label" id="l-answer">Answer</span>
        <div class="segmented" data-name="answer" aria-labelledby="l-answer">
          <button type="button" class="seg" data-value="on" aria-pressed="true">on</button>
          <button type="button" class="seg" data-value="off" aria-pressed="false">off</button>
        </div>
      </div>
      <div class="control">
        <span class="control-label" id="l-mode">Mode</span>
        <div class="segmented" data-name="mode" aria-labelledby="l-mode">
          <button type="button" class="seg" data-value="hybrid" aria-pressed="true">hybrid</button>
          <button type="button" class="seg" data-value="dense" aria-pressed="false">dense</button>
          <button type="button" class="seg" data-value="bm25" aria-pressed="false">bm25</button>
        </div>
      </div>
      <div class="control">
        <span class="control-label" id="l-rerank">Rerank</span>
        <div class="segmented" data-name="rerank" aria-labelledby="l-rerank">
          <button type="button" class="seg" data-value="on" aria-pressed="true">on</button>
          <button type="button" class="seg" data-value="off" aria-pressed="false">off</button>
        </div>
      </div>
      <div class="control">
        <span class="control-label" id="l-pagerank">PageRank</span>
        <div class="segmented" data-name="pagerank" aria-labelledby="l-pagerank">
          <button type="button" class="seg" data-value="" aria-pressed="true">auto</button>
          <button type="button" class="seg" data-value="0" aria-pressed="false">0</button>
          <button type="button" class="seg" data-value="0.25" aria-pressed="false">.25</button>
          <button type="button" class="seg" data-value="0.5" aria-pressed="false">.5</button>
          <button type="button" class="seg" data-value="1" aria-pressed="false">1</button>
        </div>
      </div>
      <div class="field">
        <label for="host">Site</label>
        <input id="host" type="text" placeholder="any" autocomplete="off">
      </div>
    </div>

    <div class="badge" id="badge" aria-live="polite" hidden>
      <span class="badge-dot" aria-hidden="true">&#9679;</span>
      <span id="badge-text"></span>
    </div>
  </section>

  <section id="answerBox" hidden>
    <h2>Answer</h2>
    <div id="answerText" class="answer"></div>
    <p id="answerMeta" class="note answer-meta"></p>
  </section>

  <section id="resultsBox" hidden>
    <h2 id="resultsTitle">Sources</h2>
    <div id="results"></div>
  </section>

  <section id="crawl" hidden>
    <h2>Crawl</h2>
    <form id="crawlForm" class="tool-row">
      <div class="field">
        <label for="crawlUrl">Start URL</label>
        <input id="crawlUrl" type="url" placeholder="https://go.dev/doc/" required>
      </div>
      <div class="field narrow">
        <label for="crawlLinks">Pages</label>
        <input id="crawlLinks" type="number" min="1" value="100">
      </div>
      <div class="field narrow">
        <label for="crawlDepth">Depth</label>
        <input id="crawlDepth" type="number" min="1" value="3">
      </div>
      <div class="control">
        <span class="control-label" id="l-scope">Scope</span>
        <div class="segmented" data-name="scope" aria-labelledby="l-scope">
          <button type="button" class="seg" data-value="site" aria-pressed="true">site</button>
          <button type="button" class="seg" data-value="section" aria-pressed="false">section</button>
          <button type="button" class="seg" data-value="anywhere" aria-pressed="false">anywhere</button>
        </div>
      </div>
      <button class="action primary" id="crawlGo">Crawl</button>
    </form>
    <p id="crawlHint" class="note">Searchable once indexed.</p>

    <table class="table">
      <thead><tr><th>URL</th><th>Status</th><th class="num">Pages</th><th class="num">Searchable</th><th class="num">When</th></tr></thead>
      <tbody id="runs"></tbody>
    </table>
  </section>
</main>

<footer class="footer">
  <p class="convert">arachne</p>
  <nav class="contact" aria-label="Links">
    <a href="https://github.com/lein3000zzz/project-arachne">GitHub</a>
    <a href="https://lein3000.dev">lein3000.dev</a>
  </nav>
</footer>

</div>

<script src="/static/theme.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let stream = null;

// ---- account ----
function toLogin() {
  location.assign("/login?next=" + encodeURIComponent(location.pathname + location.search + location.hash));
}

async function call(path, options) {
  const res = await fetch(path, options);
  if (res.status === 401) {
    toLogin();
    throw new Error("signed out");
  }
  return res;
}

call("/api/me").then((res) => res.json()).then((me) => { $("who").textContent = me.username; }).catch(() => {});

$("logout").addEventListener("click", async () => {
  try { await fetch("/api/logout", { method: "POST" }); } finally { location.assign("/login"); }
});

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const child of children) {
    if (child != null) node.append(child);
  }
  return node;
}

const fmt = (x, digits) => Number(x).toPrecision(digits);

// ---- segmented controls ----
function segValue(name) {
  const on = document.querySelector(`.segmented[data-name="${name}"] .seg[aria-pressed="true"]`);
  return on ? on.dataset.value : "";
}

function setSeg(name, value) {
  const buttons = document.querySelectorAll(`.segmented[data-name="${name}"] .seg`);
  if (![...buttons].some((b) => b.dataset.value === value)) return;
  buttons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === value)));
}

document.querySelectorAll(".segmented").forEach((group) => {
  group.addEventListener("click", (e) => {
    const button = e.target.closest(".seg");
    if (button) setSeg(group.dataset.name, button.dataset.value);
  });
});

// ---- status badge: the one coloured element ----
function badge(text, state) {
  $("badge").hidden = false;
  $("badge").className = "badge" + (state ? " " + state : "");
  $("badge-text").textContent = text;
}

// ---- results ----
function signals(r) {
  const chip = (...parts) => el("li", { class: "chip" }, ...parts);
  const out = [];
  if (r.rerank) out.push(chip("rerank ", el("b", {}, "#" + r.rerank.rank), " " + fmt(r.rerank.score, 3)));
  out.push(chip("fused ", el("b", {}, fmt(r.score, 4))));
  if (r.dense) out.push(chip("dense ", el("b", {}, "#" + r.dense.rank), " " + fmt(r.dense.score, 3)));
  if (r.bm25) out.push(chip("bm25 ", el("b", {}, "#" + r.bm25.rank), " " + fmt(r.bm25.score, 3)));
  if (r.pagerank) out.push(chip("pagerank ", el("b", {}, fmt(r.pagerank.page, 3)), " site " + fmt(r.pagerank.site, 3)));
  return el("ul", { class: "chips" }, ...out);
}

function renderResults(results, numbered) {
  $("resultsBox").hidden = results.length === 0;
  $("resultsTitle").textContent = numbered ? "Sources" : "Results";
  $("results").replaceChildren(...results.map((r, i) => {
    const n = numbered ? r.n : i + 1;
    return el("article", { class: "row", id: "src-" + n },
      el("p", { class: "row-when" }, el("span", { class: "n" }, String(n).padStart(2, "0")), r.host || ""),
      el("div", {},
        el("h3", {}, el("a", { href: r.url, target: "_blank", rel: "noopener noreferrer" }, r.title || r.url)),
        el("p", { class: "result-url" }, r.url),
        el("p", { class: "snippet" }, r.snippet || ""),
        signals(r)));
  }));
}

// The answer is plain text: only [n] citations become links.
function renderAnswer(text, sources) {
  const box = $("answerText");
  box.replaceChildren();
  let last = 0;
  for (const m of text.matchAll(/\[(\d{1,3})\]/g)) {
    const n = Number(m[1]);
    if (n < 1 || n > sources) continue;
    box.append(text.slice(last, m.index));
    const link = el("a", { class: "cite", href: "#src-" + n, title: "Source " + n }, String(n));
    link.addEventListener("click", () => flash(n));
    box.append(link);
    last = m.index + m[0].length;
  }
  box.append(text.slice(last));
}

function flash(n) {
  const item = $("src-" + n);
  if (!item) return;
  item.classList.add("flash");
  setTimeout(() => item.classList.remove("flash"), 1200);
}

function params() {
  const p = new URLSearchParams({ q: $("q").value.trim(), mode: segValue("mode") });
  if ($("host").value.trim()) p.set("host", $("host").value.trim());
  // "on" leaves the server's default, so a stack without a reranker still works.
  if (segValue("rerank") === "off") p.set("rerank", "false");
  if (segValue("pagerank") !== "") p.set("pagerank", segValue("pagerank"));
  return p;
}

async function search() {
  $("go").disabled = true;
  $("answerBox").hidden = true;
  badge("searching…", "busy");
  try {
    const p = params();
    p.set("limit", "10");
    const res = await call("/search?" + p);
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.statusText);
    renderResults(body.results, false);
    badge(body.results.length ? `${body.results.length} results · ${body.took_ms} ms` : "nothing found");
  } catch (err) {
    badge("search failed: " + err.message, "failed");
  } finally {
    $("go").disabled = false;
  }
}

function answer() {
  if (stream) stream.close();
  const started = performance.now();
  let text = "", sources = 0, first = null;

  $("go").disabled = true;
  $("results").replaceChildren();
  $("resultsBox").hidden = true;
  $("answerBox").hidden = false;
  $("answerText").replaceChildren();
  $("answerMeta").replaceChildren();
  badge("searching…", "busy");

  stream = new EventSource("/answer/stream?" + params());

  stream.addEventListener("sources", (e) => {
    const list = JSON.parse(e.data);
    sources = list.length;
    renderResults(list, true);
    badge(`${sources} sources · reading…`, "busy");
  });

  stream.addEventListener("delta", (e) => {
    if (first === null) {
      first = performance.now();
      badge("writing…", "busy");
    }
    text += JSON.parse(e.data).text;
    renderAnswer(text, sources);
  });

  stream.addEventListener("done", (e) => {
    const done = JSON.parse(e.data);
    stream.close();
    const total = ((performance.now() - started) / 1000).toFixed(1);
    const wait = first ? ((first - started) / 1000).toFixed(1) : "–";
    $("answerMeta").textContent = `${done.cited.length}/${sources} cited · ${done.usage.output_tokens} tokens · first word ${wait} s`;
    badge(`${done.model} · ${total} s`);
    $("go").disabled = false;
  });

  stream.addEventListener("error", (e) => {
    stream.close();
    let message = "the connection was lost";
    try { message = JSON.parse(e.data).error; } catch (_) {}
    // EventSource hides the status: a refused stream looks like a lost one.
    if (!e.data) call("/api/me").catch(() => {});
    $("answerMeta").replaceChildren();
    badge("no answer: " + message, "failed");
    $("go").disabled = false;
  });
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!$("q").value.trim()) return;
  const on = segValue("answer") === "on";
  history.replaceState(null, "", "?" + params() + (on ? "" : "&answer=0") + location.hash);
  on ? answer() : search();
});

// ---- crawls ----
let polling = null;

const glyphs = { queued: "○", running: "●", indexing: "◐", finished: "✓", dropped: "✕", stalled: "!" };
const active = (status) => status === "queued" || status === "running" || status === "indexing";

function ago(iso) {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return Math.round(s) + " s ago";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}

function renderRuns(list) {
  if (list.length === 0) {
    $("runs").replaceChildren(el("tr", {}, el("td", { colspan: "5", class: "note" }, "None yet.")));
    return;
  }
  $("runs").replaceChildren(...list.map((run) => el("tr", {},
    el("td", { class: "url" }, run.start_url, run.note ? el("div", { class: "note" }, run.note) : null),
    el("td", {}, el("span", { class: "state " + run.status },
      el("span", { class: "state-glyph", "aria-hidden": "true" }, glyphs[run.status] || "·"), run.status)),
    el("td", { class: "num" }, run.pages + " / " + run.max_links),
    el("td", { class: "num" }, run.docs_indexed + " / " + run.docs_queued,
      run.docs_failed ? el("div", { class: "note" }, run.docs_failed + " failed") : null),
    el("td", { class: "num" }, ago(run.submitted_at)))));
}

async function loadRuns() {
  try {
    const res = await call("/api/runs?limit=8");
    if (res.status === 503) { $("crawl").hidden = true; return; }
    const body = await res.json();
    $("crawl").hidden = false;
    renderRuns(body.runs);
    clearTimeout(polling);
    if (body.runs.some((r) => active(r.status))) polling = setTimeout(loadRuns, 3000);
  } catch (_) {
    clearTimeout(polling);
    polling = setTimeout(loadRuns, 10000);
  }
}

$("crawlForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("crawlGo").disabled = true;
  try {
    const res = await call("/api/runs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        url: $("crawlUrl").value.trim(),
        scope: segValue("scope"),
        links: Number($("crawlLinks").value),
        depth: Number($("crawlDepth").value),
      }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.statusText);
    $("crawlUrl").value = "";
    $("crawlHint").textContent = "Queued " + body.start_url;
    loadRuns();
  } catch (err) {
    $("crawlHint").replaceChildren(el("span", { class: "error" }, err.message));
  } finally {
    $("crawlGo").disabled = false;
  }
});

loadRuns();

// A link with ?q= runs that search, so results can be shared.
{
  const p = new URLSearchParams(location.search);
  if (p.get("q")) {
    $("q").value = p.get("q");
    if (p.get("mode")) setSeg("mode", p.get("mode"));
    if (p.get("host")) $("host").value = p.get("host");
    if (p.get("rerank") === "false") setSeg("rerank", "off");
    if (p.get("pagerank")) setSeg("pagerank", p.get("pagerank"));
    if (p.get("answer") === "0") setSeg("answer", "off");
    segValue("answer") === "on" ? answer() : search();
  }
}
</script>
</body>
</html>
