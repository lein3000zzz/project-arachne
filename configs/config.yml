crawler:
  # sent on every request, robots.txt included; robots.txt rules are matched
  # against the product name before the first "/"
  user_agent: "project-arachne/0.1 (+https://github.com/lein3000zzz/project-arachne)"
  task_workers: 20
  run_workers: 1
  saver_workers: 10
  # katana (readability text + jsluice links) or legacy (links only, no text)
  parser_engine: katana
  saver_send_timeout: 3s
  # whole request, redirects and body included
  fetch_timeout: 30s
  # regular expressions over the percent-decoded URL: matching links are recorded
  # in the graph but never followed (a start URL always is). Leave the key out
  # for the built-in list: MediaWiki namespace pages in English and Russian, and
  # edit / history / index.php views.
  # exclude:
  #   - '/login'

chunker:
  max_runes: 1200
  overlap_runes: 150
  min_document_runes: 80

embedding:
  # served over the OpenAI /v1/embeddings API; the endpoint itself is in Vault.
  # Another model or dimensions means another collection, empty at first:
  # `make reembed` fills it from the old one's chunks, without crawling again.
  model: qwen3-embedding:0.6b
  # 0 = the model's native size; a smaller value truncates (Matryoshka models only)
  dimensions: 0
  # small enough that a batch finishes well inside request_timeout on 4 cores
  batch_size: 16
  request_timeout: 2m
  max_retries: 4
  # prepended to search queries only; this is Qwen3's web-search instruction,
  # other models want their own or an empty string
  query_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "

vector_store:
  # collection name = <prefix>_<schema version>_<model>_<dimensions>
  collection_prefix: chunks

indexer:
  # embedding runs on these workers, never on the crawl workers; on a CPU-bound
  # embedder more workers only make each request wait longer
  workers: 2
  # pages waiting in Postgres (index_queue) to be indexed; they outlive the
  # crawler. Past this many a crawl worker waits for room
  queue_size: 2000
  # a page that can't be queued in time is skipped and indexed on its next crawl
  enqueue_timeout: 5s
  # text indexed per page, in characters (as documents.max_runes for documents):
  # a huge page would otherwise become thousands of chunks
  max_runes: 150000

retrieval:
  # chunks taken from each of dense and BM25 before folding into pages and fusing
  candidates: 100
  # reciprocal rank fusion: score = sum of 1/(rrf_k + rank) over the lists
  rrf_k: 60
  default_limit: 10
  max_limit: 100
  # page and site PageRank as extra RRF lists; 0 = scores shown, order unchanged
  pagerank_weight: 0
  siterank_weight: 0

rerank:
  # cross-encoder over the rerank API (llama.cpp, vLLM, Jina, Cohere); the
  # endpoint and key are in Vault (RERANK_BASE_URL, RERANK_API_KEY)
  enabled: true
  model: bge-reranker-v2-m3
  # top fused pages reordered; cost is linear in this - about 0.23 s per page
  # on 4 cores with bge-reranker-v2-m3
  candidates: 10
  request_timeout: 60s
  max_retries: 2

search:
  listen: ":8090"
  request_timeout: 30s

rank:
  # chance of following a link rather than jumping to a random page
  damping: 0.85
  # iteration stops once the scores move less than this in total (L1)
  tolerance: 1.0e-9
  max_iterations: 100
  # never-fetched pages differing from a fetched one only by scheme or trailing
  # slash; each is fetched once to ask whether it redirects there
  twin_checks: 500
  # the ranker service re-ranks when a crawl finished since its last run
  watch_interval: 30s

crawl_api:
  # lets the search service start crawls (UI and POST /api/runs); any signed-in
  # user can then make the crawler fetch any site
  enabled: true
  default_depth: 3
  max_depth: 5
  default_links: 100
  max_links: 2000

auth:
  session_ttl: 720h
  # failed logins tolerated per username and per client address within
  # failure_window; the next one locks them for lockout, doubling with each
  # further failure up to max_lockout
  user_failures: 5
  ip_failures: 20
  failure_window: 1h
  lockout: 1m
  max_lockout: 15m
  # password hashes at once (argon2id, 64 MiB each while it runs)
  hash_concurrency: 2

chat:
  # openai-compatible: Ollama, vLLM, OpenRouter, DeepSeek… — openai: OpenAI itself
  # (sends max_completion_tokens) — anthropic: the Messages API. The endpoint and
  # key are in Vault (CHAT_BASE_URL, CHAT_API_KEY); see configs/chat-*.yml.
  provider: openai-compatible
  model: qwen3:4b-instruct
  max_tokens: 1024
  # remove to send none; OpenAI's reasoning models accept only their default
  temperature: 0.2
  request_timeout: 5m
  max_retries: 2
  # search results given to the model as sources, one excerpt each, cut to
  # source_runes (0 = whole). Reading them is most of the wait before the first
  # word on a CPU: 4 × 600 halves it against 6 whole chunks.
  context_chunks: 4
  source_runes: 600
  # reranked results scoring below this (bge-reranker logits: relevant pages
  # ~1 to 3, unrelated -3 to -7) are left out while any score above it; when
  # none does, the best found are read and the answer is marked weak. Only
  # applies with reranking on.
  min_relevance: 0

review:
  # the chat model looks at every new or changed page before it is indexed, and
  # turns away menus, error pages, spam and text aimed at AI models. Costs one
  # model conversation per page: roughly 10-30 s on 4 CPU cores.
  enabled: true
  # empty: chat.model. A smaller model is faster, and needs pulling first.
  model: ""
  # read_part / search_index calls before the verdict is required. On 8 known
  # pages, 1 judged as well as 3 at 5.8 s a page instead of 7.9 (documentation
  # 7-9 s instead of 15-16): the model reads on when allowed, needed or not.
  # Text aimed at AI models is found by code in the whole page either way.
  max_tool_calls: 1
  # the page is shown to the model in parts of this many characters
  part_runes: 600
  max_tokens: 300
  timeout: 3m

verify:
  # after an answer is written, each sentence that cites sources is checked
  # against the excerpts it cites - supported, partly, unsupported - one short
  # model call each, while the answer is already on screen. Marked, never
  # removed.
  enabled: true
  # empty: chat.model
  model: ""
  # claims past this many are left unchecked
  max_claims: 8
  max_tokens: 100
  timeout: 3m
  # then one more call: do any two of the sources disagree on a point? A
  # disagreement is shown only with each side's own words, found in its
  # excerpt
  conflicts: true

weblookup:
  # "Look on the web" on the Look up page, for when the index holds too
  # little: the question is searched with websearch.default_engines, the model
  # picks the results worth reading, and those pages are crawled, reviewed and
  # indexed into the shared base before the answer reads them. Needs SearXNG
  # and crawling. PDFs among them are not read: documents are lab sources.
  enabled: true
  results: 8
  read: 4
  # a page fetched this recently is read from the index, not fetched again
  fresh_for: 168h
  # crawls not done by then are left, and the answer reads what is indexed
  timeout: 3m
  choose_tokens: 200

ui:
  # rows a list on the pages (a lab's sources, pages, research works) shows
  # at a time; the rest is a page further
  list_size: 15

facts:
  # the ledger: the pages of labs digested into short claims, each resting on
  # sentences of its page, by the server's chat model, in the background
  enabled: true
  # chunks of a page digested as soon as it is indexed (its start, its end
  # and between); the rest when an answer reads them. ~5-20 s a chunk on CPU
  max_chunks: 12
  every: 30s

mcp:
  # an MCP server at /mcp for agents (Claude Code and the like), signed in
  # with an API token each user makes on their settings page. It does what
  # the pages do: search, ask, labs and their sources, reports.
  enabled: true

endpoints:
  # users may bring their own chat model on their settings page: an OpenAI- or
  # Anthropic-compatible endpoint, used for their answers, claim checks, lab
  # plans, reports and research. Without one, the server's model (chat.*)
  # answers. Keys are sealed with ENDPOINT_KEY from Vault. Page review stays
  # on the server's model: it serves the shared base.
  enabled: true
  # endpoints are called from inside the server's network, so they may not
  # reach private addresses (Vault, Postgres...) unless the host is listed
  # here - a model server on this machine, say. Only listed hosts may use
  # plain http. Example: [host.docker.internal]
  allowed_hosts: []
  # any address, private ones included: only where every user is trusted
  # with the server's network
  allow_private_networks: false
  test_timeout: 30s

artifacts:
  # research reports: the model drafts an outline, the user confirms it, then
  # each section is written from the lab's documents alone - a section the
  # lab cannot cover is marked, never filled from memory. One model call per
  # section, plus the check: minutes on a CPU, so it runs in the background.
  max_sections: 7
  section_tokens: 600
  outline_tokens: 400
  timeout: 30m
  # check each section's claims as answers are checked (verify.*)
  verify: true

documents:
  # read the documents labs add - PDFs, Office files, EPUB, scans (OCR, Russian
  # and English) - with Apache Tika. Only a lab's own source is read: a link
  # given, a file uploaded, a reference taken, or a work research read. Off,
  # Tika does not start (make reads this), such documents stay
  # unread and only text files can be uploaded. Tika: 0.3 GB idle, at most
  # 1.5 GB; its address is in Vault (DOCUMENTS_BASE_URL).
  enabled: true
  # text kept per document, in characters: 150k is ~130 chunks, a few minutes
  # of embedding on 4 cores
  max_runes: 150000
  # one document, OCR included: a scan takes ~1-2 s a page
  timeout: 5m
  # documents read at once (Tika has 2 CPUs); each reply is held in the
  # crawler's memory while it is cleaned
  concurrent: 2

websearch:
  # engines a new lab may search unless its creator chooses (the SearXNG
  # instance's address is in Vault: WEBSEARCH_BASE_URL)
  default_engines: [brave, google cse, bing, wikipedia]
  request_timeout: 15s

research:
  # "Research this topic" on a lab: rounds of finding works on the topic -
  # web search with the lab's engines, OpenAlex for papers, the works a kept
  # one cites and the works citing it - the model judging each from its
  # title and snippet, and the kept ones read into the lab. A run stops when
  # new rounds find little new (saturated), or at its budget, rounds or time.
  enabled: true
  # works judged and read per run, unless the user says; and at most
  found: 300
  read: 50
  max_found: 2000
  max_read: 300
  rounds: 4
  judge_batch: 10
  search_results: 10
  paper_results: 25
  # references and citing works taken per work followed
  per_work: 30
  max_tokens: 800
  # a round waits this long for its works to be read: what they cite feeds
  # the next round
  round_wait: 8m
  timeout: 3h
  openalex:
    # papers, their references and the works citing them. Free key in Vault
    # (make up OPENALEX_API_KEY=...): $1 of calls a day, about 10,000
    # citation lookups or 1,000 searches; keyless gets a tenth
    enabled: true
    base_url: https://api.openalex.org
    request_timeout: 20s

labs:
  # research reads its works into the lab as sources
  max_sources: 500
  # an answer from labs with fewer good sources in them fills the rest of
  # chat.context_chunks from the shared base
  min_sources: 2

cache:
  page_ttl: 12h
  robots_ttl: 12h
  document_hash_ttl: 720h
  redis_max_memory: 512mb

queue:
  channel_buffer: 50
  request_timeout: 30s
  # also how often processed offsets are committed
  flush_interval: 1s

run_state:
  ttl: 24h
  # a run with no task starting or finishing for this long loses its slot
  slot_lease: 10m

shutdown:
  timeout: 30s
  component_timeout: 10s
